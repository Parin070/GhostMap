[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostmap"
version = "0.1.0"
description = "Multi-module OSINT CLI tool"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "aiohttp",
    "requests",
    "python-dotenv",
    "beautifulsoup4",
    "ddgs",
    "sherlock-project",
    "shodan",
    "python-whois",
    "dnspython",
    "tldextract",
]

[project.optional-dependencies]
face = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "opencv-python",
    "numpy",
    "playwright>=1.40",
]

[project.scripts]
ghostmap = "osint.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["osint*"]